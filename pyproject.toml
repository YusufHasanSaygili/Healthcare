[project]
name = "healthcare"
version = "0.1.0"
description = "From-scratch pathogenicity prediction for germline genetic variants"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2",
    "onnx>=1.23.2",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.31.0",
    "optuna>=5.0.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pyfaidx>=0.9.0.4",
    "scikit-learn>=1.9.1",
    "torch>=2.14",
    "transformers>=5.19.0",
]

[project.scripts]
healthcare = "healthcare.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "graphify-out", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_cache/tmp"
